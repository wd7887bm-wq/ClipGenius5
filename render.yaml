databases:
  # Durable PostgreSQL so jobs/clips survive instance sleep & redeploys.
  # Free databases expire after 30 days on Render — upgrade to a paid plan
  # (or set DATABASE_URL to an external DB) for production.
  - name: clipgenius-db
    plan: free
    ipAllowList: []

services:
  - type: web
    name: clipgenius
    env: node
    buildCommand: npm install && npm run build
    startCommand: bash scripts/setup.sh && npm start
    plan: free
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
      # Auto-injected from the database above. The app gracefully falls back to
      # the file store if this is ever missing or unreachable.
      - key: DATABASE_URL
        fromDatabase:
          name: clipgenius-db
          property: connectionString
