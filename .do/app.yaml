name: clipgenius
region: sgp1
# Durable PostgreSQL so jobs/clips survive redeploys & scaling.
# DO App Platform auto-provides DATABASE_URL to services in the same app.
databases:
  - name: clipgenius-db
    engine: PG
    version: "15"
    production: false
services:
  - name: web
    github:
      repo: wd7887bm-wq/ClipGenius5
      branch: main
    build_command: npm install && npm run build
    run_command: npm start
    http_port: $PORT
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    envs:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
